<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TADJROUNA.1 - ساعة الصلاة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8c775;--op:.45;--clock:25;--u:min(1vw,1.7778vh);--v:1vh}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:Cairo,Tahoma,sans-serif;cursor:none}
#bg{position:fixed;inset:0;background:center/cover no-repeat;transition:background-image 1s}
#shade{position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,calc(var(--op)*.8)),rgba(0,0,0,var(--op)) 50%,rgba(0,0,0,calc(var(--op)*1.6)))}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(2*var(--u)) calc(3*var(--u)) calc(2.4*var(--u));text-shadow:0 calc(.2*var(--u)) calc(.8*var(--u)) rgba(0,0,0,.7)}
#head{text-align:center}#place{font-size:calc(5.8*var(--u));font-weight:900;line-height:1.15;color:#fff3b0;text-shadow:0 calc(.3*var(--u)) calc(1.4*var(--u)) rgba(0,0,0,.95)}#mosque{font-size:calc(2.6*var(--u));font-weight:700;line-height:1.3;color:#fff3b0;margin-top:calc(.3*var(--u));text-shadow:0 calc(.25*var(--u)) calc(1*var(--u)) rgba(0,0,0,.95)}#dhikr{margin-top:calc(1.2*var(--u));max-width:90%;background:rgba(0,0,0,.48);border:1px solid rgba(255,243,176,.28);border-radius:calc(1.4*var(--u));padding:calc(.8*var(--u)) calc(1.8*var(--u));font-size:calc(2.2*var(--u));font-weight:700;color:#fff8dc;line-height:1.45}
#mid{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
#clock{font-size:calc(var(--clock)*var(--u));font-weight:900;line-height:1;text-shadow:0 calc(.5*var(--u)) calc(2*var(--u)) rgba(0,0,0,.8);font-variant-numeric:tabular-nums;direction:ltr}
#clock small{font-size:.35em;opacity:.85}
#nowp{display:none;position:absolute;top:calc(2.2*var(--u));inset-inline-start:calc(3*var(--u));font-size:calc(2.2*var(--u));color:var(--gold)}
#dates{margin-top:calc(1*var(--u));max-width:94%;font-size:calc(3.9*var(--u));font-weight:600;line-height:1.35;text-wrap:balance}
#dates b{color:var(--gold);font-weight:800}
#bar{width:100%;display:flex;justify-content:space-between;gap:var(--u);background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(calc(1.2*var(--u)));backdrop-filter:blur(calc(1.2*var(--u)));border:1px solid rgba(232,199,117,.3);border-radius:calc(2*var(--u));padding:calc(1.2*var(--u))}
.p{flex:1;min-width:0;text-align:center;padding:calc(.8*var(--u)) calc(.3*var(--u));border-radius:calc(1.4*var(--u));transition:.4s}
.p span{display:block;font-size:calc(2.6*var(--u));font-weight:600;line-height:1.3;opacity:.95}
.p em{font-style:normal;font-size:calc(5.2*var(--u));font-weight:700;line-height:1.15;direction:ltr;display:block;font-variant-numeric:tabular-nums}
.p.next{background:rgba(232,199,117,.22);color:var(--gold);box-shadow:0 0 0 calc(.2*var(--u)) var(--gold)}
#set{position:fixed;inset:0;display:none;background:rgba(0,0,0,.82);overflow:auto;cursor:auto;padding:calc(3*var(--v)) 0;text-shadow:none}
#set.on{display:block}
#box{max-width:820px;margin:auto;padding:24px;font-size:20px}
#box h2{color:var(--gold);margin-bottom:12px}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #333}
input,select,button{font:inherit;color:#fff;background:#222;border:2px solid #444;border-radius:10px;padding:8px 12px;max-width:55%}
input[type=range]{padding:0;width:55%}input[type=checkbox]{width:28px;height:28px}
input:focus,select:focus,button:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,199,117,.4)}
button{cursor:pointer;max-width:none;margin:12px 6px 0 0}.gold{background:var(--gold);color:#000;font-weight:600}
@media (orientation:portrait){:root{--u:min(1vh,1.7778vw);--v:1vw}#bg,#shade,#ui,#set{inset:auto;top:0;left:0;width:100vh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}}
</style><script>;(function(){const ADHKAR=["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ","لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ","أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ وَأَتُوبُ إِلَيْهِ","سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ","لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ","رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ"];let di=0;const de=document.getElementById("dhikr");if(de){const upd=()=>{de.textContent=ADHKAR[di%ADHKAR.length];di++};upd();setInterval(upd,18000);}})();</script></head><body>

<div id="ui"><div id="head"><div id="place"></div><div id="mosque">مسجد سيدي محمد بن يوسف</div></div>

<label>المدينة<select id="city"></select></label>
<label>خط العرض<input id="lat" type="number" step="0.01"></label>
<label>خط الطول<input id="lng" type="number" step="0.01"></label>
<label>اسم المنطقة<input id="name"></label>
<label>طريقة الحساب<select id="meth"><option value="0">رابطة العالم الإسلامي</option><option value="1">وزارة الشؤون الدينية (الجزائر)</option><option value="2">الهيئة المصرية</option><option value="3">أم القرى</option><option value="4">كراتشي</option></select></label>
<label>المذهب (العصر)<select id="asr"><option value="1">جمهور (شافعي/مالكي/حنبلي)</option><option value="2">حنفي</option></select></label>
<label>شفافية التعتيم<input id="op" type="range" min="0" max="80" value="45"></label>
<label>حجم الساعة<input id="size" type="range" min="10" max="30" value="25"></label>
<label>إظهار الثواني<input id="sec" type="checkbox"></label>
<label>قارئ سورة الكهف<select id="rec"></select></label>
<label>رابط مخصص (mp3)<input id="url" dir="ltr" placeholder="https://..."></label>
<label>مستوى الصوت<input id="vol" type="range" min="0" max="100"></label>
<label>تشغيل تلقائي يوم الجمعة عند الفجر<input id="fri" type="checkbox"></label>
<label>صورة الخلفية<input id="file" type="file" accept="image/*"></label>
<button id="play" class="gold">▶ تشغيل سورة الكهف</button><button id="stop">⏹ إيقاف</button><button id="gps">تحديد موقعي تلقائياً</button><button id="reset">الصورة الافتراضية</button><button id="fs">ملء الشاشة</button><button class="gold" id="close">حفظ وإغلاق</button>
</div></div>

const R=Math.PI/180,sin=a=>Math.sin(a*R),cos=a=>Math.cos(a*R),fix=(a,b)=>((a%b)+b)%b;
function times(d){
 const D=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5+2440587.5+.5-2451545;
 const g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),L=fix(q+1.915*sin(g)+.02*sin(2*g),360),e=23.439-4e-7*D;
 const RA=fix(Math.atan2(cos(e)*sin(L),cos(L))/R/15,24),dec=Math.asin(sin(e)*sin(L))/R,eq=q/15-RA;
 const tz=-d.getTimezoneOffset()/60,noon=12+tz-S.lng/15-(eq>12?eq-24:eq<-12?eq+24:eq);
 const T=a=>Math.acos((-sin(a)-sin(S.lat)*sin(dec))/(cos(S.lat)*cos(dec)))/R/15;
 const k=+S.asr+Math.tan(Math.abs(S.lat-dec)*R);
 const ta=Math.acos((sin(Math.atan(1/k)/R)-sin(S.lat)*sin(dec))/(cos(S.lat)*cos(dec)))/R/15;
 const [fa,ia]=M[S.meth],mg=noon+T(.833);
 return [noon-T(fa),noon+.017,noon+ta,mg+(S.meth==1?.05:0),ia=="90"?mg+1.5:noon+T(ia)];
}
const fmt=h=>{h=fix(Math.round(h*60),1440);return String(Math.floor(h/60)).padStart(2,"0")+":"+String(h%60).padStart(2,"0")};
const N=["الفجر","الظهر","العصر","المغرب","العشاء"];
function bar(now){
 const t=times(now),c=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
 let n=t.findIndex(x=>x>c);if(n<0)n=0;
 $("bar").innerHTML=N.map((x,i)=>`<div class="p${i==n?" next":""}"><span>${x}</span><em>${fmt(t[i])}</em></div>`).join("");
}
let lastDay=-1;
function tick(){
 const d=new Date(),p=x=>String(x).padStart(2,"0");
 $("clock").innerHTML=p(d.getHours())+":"+p(d.getMinutes())+(S.sec?"<small>:"+p(d.getSeconds())+"</small>":"");
 fri(d);
 if(d.getDate()!=lastDay||d.getSeconds()==0){
  lastDay=d.getDate();
  const o={calendar:"gregory",numberingSystem:"latn"};
  const day=new Intl.DateTimeFormat("ar",{weekday:"long"}).format(d);
  const g=new Intl.DateTimeFormat("ar-u-nu-latn-ca-gregory",{day:"numeric",month:"long",year:"numeric"}).format(d);

}

 if(!on&&["Enter","ContextMenu","F2"," "].includes(e.key)){open(true);e.preventDefault()}
 else if(on&&["Escape","Backspace"].includes(e.key)&&!/INPUT/.test(document.activeElement.tagName)){open(false)}});
$("ui").addEventListener("click",()=>open(true));
const RECS=[{n:"مشاري العفاسي",u:"https://server8.mp3quran.net/afs/018.mp3"},{n:"ماهر المعيقلي",u:"https://server12.mp3quran.net/maher/018.mp3"},{n:"عبد الرحمن السديس",u:"https://server11.mp3quran.net/sds/018.mp3"},{n:"سعود الشريم",u:"https://server7.mp3quran.net/shur/018.mp3"},{n:"ملف محلي داخل التطبيق (kahf.mp3)",u:"kahf.mp3"},{n:"رابط مخصص",u:""}];
$("rec").innerHTML=RECS.map((r,i)=>`<option value="${i}">${r.n}</option>`).join("");
const aud=$("aud");
function play(q){const r=RECS[S.rec]||RECS[0],u=r.u||S.url;if(!u){q||alert("أدخل الرابط");return}aud.src=u;aud.volume=S.vol/100;aud.play().then(()=>$("nowp").style.display="block").catch(()=>{q||alert("تعذر تشغيل الصوت، تحقق من الإنترنت أو الرابط")})}
function stop(){aud.pause();$("nowp").style.display="none"}
aud.onended=aud.onerror=stop;
$("play").onclick=()=>play(false);$("stop").onclick=stop;
function fri(d){if(!S.fri||d.getDay()!=5)return;const k=d.toDateString();if(S.fday===k)return;const t=times(d)[0];if(d.getHours()+d.getMinutes()/60>=t){S.fday=k;save();play(true)}}
